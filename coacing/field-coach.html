<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Comets Field Coach</title>
<style>
  :root{
    --dirt: #b98a5e;
    --dirt-dark: #a87850;
    --grass: #4c7a3f;
    --grass-dark: #436b38;
    --chalk: #f2ede3;
    --panel-bg: #14201a;
    --panel-bg-2: #1c2b22;
    --ink: #eef4ee;
    --ink-dim: #9db2a3;
    --accent: #e0a63a;
    --accent-2: #4fb0d6;
    --danger: #d6614f;
    --border: rgba(255,255,255,0.12);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; background: var(--panel-bg);
    font-family: var(--font); color: var(--ink); overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px; background: var(--panel-bg-2);
    border-bottom: 1px solid var(--border); gap: 8px; flex-shrink:0;
  }
  header h1{ font-size:16px; font-weight:600; margin:0; letter-spacing:0.2px; }
  header .sub{ font-size:11px; color: var(--ink-dim); margin-top:1px; }
  .icon-btn{
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--ink); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-weight:500; display:flex; align-items:center; gap:6px;
  }
  .icon-btn:active{ background: rgba(255,255,255,0.14); }
  .icon-btn.active-toggle{ background: var(--danger); color:#fff; border-color: var(--danger); }

  #laserDot{
    position:absolute; width:22px; height:22px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,60,40,0.95) 0%, rgba(255,60,40,0.55) 45%, rgba(255,60,40,0) 75%);
    transform: translate(-50%,-50%); pointer-events:none; opacity:0; z-index:12;
    transition: opacity 0.35s ease;
  }
  #laserDot.show{ opacity:1; transition: opacity 0s; }
  #fieldWrap.laser-active #fieldSvg{ cursor: crosshair; }

  #fieldWrap{ flex:1; position:relative; overflow:hidden; touch-action:none; background: var(--grass); }
  #fieldSvg{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .token{ cursor: grab; touch-action:none; }
  .token:active{ cursor: grabbing; }
  .token-label{
    font: 600 13px var(--font); fill: #fff; text-anchor:middle; dominant-baseline:central;
    pointer-events:none; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width:2.5px;
  }
  .path-line{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .path-arrowhead{ fill: inherit; }

  #bottomBar{
    background: var(--panel-bg-2); border-top: 1px solid var(--border);
    padding: 8px 10px 10px; flex-shrink:0;
  }
  .mode-row{ display:flex; gap:6px; margin-bottom:8px; }
  .mode-btn{
    flex:1; background: rgba(255,255,255,0.04); border:1px solid var(--border);
    color: var(--ink-dim); border-radius:9px; padding:9px 4px; font-size:12.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .mode-btn.active{ background: var(--accent); color:#2a1d05; border-color: var(--accent); }
  .mode-btn .tag{ font-size:9.5px; font-weight:500; opacity:0.85; }

  .tool-row{ display:flex; gap:6px; align-items:center; }
  .tool-row .icon-btn{ flex:1; justify-content:center; font-size:12.5px; padding:9px 4px; }
  .tool-row .icon-btn.wide{ flex:1.4; }
  .tool-row .icon-btn.danger{ color: var(--danger); border-color: rgba(214,97,79,0.4); }
  .tool-row .icon-btn.primary{ background: var(--accent); color:#2a1d05; border-color: var(--accent); }
  .tool-row .icon-btn.primary.playing{ background: var(--accent-2); border-color: var(--accent-2); }
  .tool-row .icon-btn[disabled]{ opacity:0.35; }

  #recPathHint{
    text-align:center; font-size:11.5px; color: var(--accent); padding: 4px 0 6px;
    display:none;
  }
  #recPathHint.show{ display:block; }

  #paletteSheet{
    position:absolute; left:0; right:0; bottom:0; background: var(--panel-bg-2);
    border-top: 1px solid var(--border); border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.22s ease;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.35); z-index:20;
  }
  #paletteSheet.open{ transform: translateY(0); }
  #paletteSheet h3{ margin:0 0 10px; font-size:14px; font-weight:600; }
  .palette-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
  .palette-item{
    background: rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px;
    padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .palette-item .dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; }
  .palette-item span.label{ font-size:10.5px; color: var(--ink-dim); }
  .palette-close{ margin-top:12px; width:100%; text-align:center; }
  #overlayScrim{
    position:absolute; inset:0; background: rgba(0,0,0,0.4); z-index:15; display:none;
  }
  #overlayScrim.show{ display:block; }

  #libSheet{
    position:absolute; left:0; right:0; bottom:0; top:0; background: var(--panel-bg);
    transform: translateX(100%); transition: transform 0.22s ease; z-index:30;
    display:flex; flex-direction:column;
  }
  #libSheet.open{ transform: translateX(0); }
  #libSheet header{ background: var(--panel-bg-2); }
  #libList{ flex:1; overflow-y:auto; padding: 10px 12px; }
  .lib-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--panel-bg-2); border:1px solid var(--border); border-radius:10px;
    padding: 12px 14px; margin-bottom:8px;
  }
  .lib-item .meta{ flex:1; min-width:0; }
  .lib-item .name{ font-size:14px; font-weight:600; }
  .lib-item .desc{ font-size:11.5px; color: var(--ink-dim); margin-top:2px; }
  .lib-item .actions{ display:flex; gap:6px; flex-shrink:0; }
  .lib-item .actions button{
    background: rgba(255,255,255,0.06); border:1px solid var(--border); color: var(--ink);
    border-radius:7px; padding:7px 10px; font-size:12px; font-weight:500;
  }
  .lib-item .actions button.del{ color: var(--danger); }
  #libEmpty{ text-align:center; color: var(--ink-dim); font-size:13px; padding: 40px 20px; }

  #toast{
    position:absolute; left:50%; bottom:90px; transform: translateX(-50%);
    background: rgba(20,32,26,0.95); color:#fff; padding:9px 16px; border-radius:20px;
    font-size:12.5px; font-weight:500; opacity:0; pointer-events:none; transition: opacity 0.2s;
    z-index:40; white-space:nowrap; border:1px solid var(--border);
  }
  #toast.show{ opacity:1; }

  #saveDialog{
    position:absolute; inset:0; background: rgba(0,0,0,0.55); z-index:35;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  #saveDialog.show{ display:flex; }
  #confirmDialog{
    position:absolute; inset:0; background: rgba(0,0,0,0.55); z-index:36;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  #confirmDialog.show{ display:flex; }
  .dialog-box{
    background: var(--panel-bg-2); border-radius:14px; padding:18px; width:100%; max-width:340px;
    border: 1px solid var(--border);
  }
  .dialog-box h3{ margin:0 0 12px; font-size:15px; }
  .dialog-box input{
    width:100%; background: rgba(255,255,255,0.06); border:1px solid var(--border);
    color: var(--ink); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:10px;
  }
  .dialog-actions{ display:flex; gap:8px; margin-top:4px; }
  .dialog-actions button{ flex:1; padding:10px; border-radius:8px; font-size:13.5px; font-weight:600; border:1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--ink); }
  .dialog-actions button.confirm{ background: var(--accent); color:#2a1d05; border-color: var(--accent); }
  .dialog-actions button.danger-confirm{ background: var(--danger); color:#fff; border-color: var(--danger); }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1>Field Coach</h1>
      <div class="sub" id="modeLabel">Live mode &mdash; drag players while you talk</div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="icon-btn" id="laserBtn">Laser</button>
      <button class="icon-btn" id="libraryBtn">Library</button>
    </div>
  </header>

  <div id="fieldWrap">
    <svg id="fieldSvg" viewBox="0 0 700 680" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="laserDot"></div>
    <div id="overlayScrim"></div>

    <div id="paletteSheet">
      <h3>Add to field</h3>
      <button class="icon-btn primary" id="addAllDefenseBtn" style="width:100%; margin-bottom:12px; justify-content:center;">+ Add all 9 defensive players</button>
      <div class="palette-grid" id="paletteGrid"></div>
      <button class="icon-btn palette-close" id="paletteClose">Close</button>
    </div>

    <div id="toast"></div>

    <div id="saveDialog">
      <div class="dialog-box">
        <h3>Save this play</h3>
        <input type="text" id="saveNameInput" placeholder="e.g. Bunt defense, runner on 1st" maxlength="60">
        <div class="dialog-actions">
          <button id="saveCancelBtn">Cancel</button>
          <button class="confirm" id="saveConfirmBtn">Save</button>
        </div>
      </div>
    </div>

    <div id="confirmDialog">
      <div class="dialog-box">
        <h3 id="confirmMessage">Are you sure?</h3>
        <div class="dialog-actions">
          <button id="confirmCancelBtn">Cancel</button>
          <button class="confirm danger-confirm" id="confirmOkBtn">Confirm</button>
        </div>
      </div>
    </div>

    <div id="libSheet">
      <header>
        <h1>Play library</h1>
        <button class="icon-btn" id="libCloseBtn">Done</button>
      </header>
      <div id="libList"></div>
    </div>
  </div>

  <div id="bottomBar">
    <div id="recPathHint">Drag to record each player's move &middot; everyone's 1st move plays together in real time &middot; drag again to add a 2nd move after that</div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="live">
        Live
        <span class="tag">drag &amp; narrate</span>
      </button>
      <button class="mode-btn" data-mode="record">
        Record paths
        <span class="tag">script a play</span>
      </button>
      <button class="mode-btn" data-mode="play">
        Play
        <span class="tag">run animation</span>
      </button>
    </div>
    <div class="tool-row" id="toolRowLive">
      <button class="icon-btn wide" id="addBtn">+ Add player</button>
      <button class="icon-btn" id="ballBtn">+ Ball</button>
      <button class="icon-btn" id="resetPosBtn">Reset positions</button>
      <button class="icon-btn danger" id="clearBtn">Clear</button>
      <button class="icon-btn primary" id="saveBtn">Save</button>
    </div>
    <div class="tool-row" id="toolRowRecord" style="display:none;">
      <button class="icon-btn" id="undoSegBtn">Undo last</button>
      <button class="icon-btn" id="resetPathsBtn">Reset paths</button>
      <button class="icon-btn" id="resetPosBtn2">Reset positions</button>
      <button class="icon-btn primary" id="saveBtn2">Save</button>
    </div>
    <div class="tool-row" id="toolRowPlay" style="display:none;">
      <button class="icon-btn primary wide" id="playBtn">&#9654; Play animation</button>
      <button class="icon-btn" id="speedBtn">1x</button>
      <button class="icon-btn" id="rewindBtn">&#9664; Rewind</button>
    </div>
  </div>

</div>

<script>
(function(){
  var SVG_NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById('fieldSvg');
  var fieldWrap = document.getElementById('fieldWrap');
  var VB_W = 700, VB_H = 680;

  var PALETTE = [
    {id:'P', label:'P', name:'Pitcher', color:'#3a6fa8'},
    {id:'C', label:'C', name:'Catcher', color:'#3a6fa8'},
    {id:'1B', label:'1B', name:'First base', color:'#3a6fa8'},
    {id:'2B', label:'2B', name:'Second base', color:'#3a6fa8'},
    {id:'3B', label:'3B', name:'Third base', color:'#3a6fa8'},
    {id:'SS', label:'SS', name:'Shortstop', color:'#3a6fa8'},
    {id:'LF', label:'LF', name:'Left field', color:'#3a6fa8'},
    {id:'CF', label:'CF', name:'Center field', color:'#3a6fa8'},
    {id:'RF', label:'RF', name:'Right field', color:'#3a6fa8'},
    {id:'R1', label:'R1', name:'Runner on 1st', color:'#c1553f', isRunner:true},
    {id:'R2', label:'R2', name:'Runner on 2nd', color:'#c1553f', isRunner:true},
    {id:'R3', label:'R3', name:'Runner on 3rd', color:'#c1553f', isRunner:true},
    {id:'BR', label:'BR', name:'Batter/runner', color:'#c1553f', isRunner:true},
    {id:'CO', label:'CO', name:'Coach', color:'#7a6a4f'}
  ];

  var DEFENSE_IDS = ['P','C','1B','2B','3B','SS','LF','CF','RF'];

  var state = {
    mode: 'live',
    tokens: [],
    ball: null,
    nextInstanceId: 1,
    playbackSpeed: 1,
    playing: false,
    lastPlayStart: null
  };

  function uid(){ return 't' + (state.nextInstanceId++); }

  function drawField(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = document.createElementNS(SVG_NS,'defs');
    var grad = document.createElementNS(SVG_NS,'radialGradient');
    grad.setAttribute('id','grassGrad'); grad.setAttribute('cx','50%'); grad.setAttribute('cy','35%'); grad.setAttribute('r','75%');
    var s1 = document.createElementNS(SVG_NS,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','#5a8a4a');
    var s2 = document.createElementNS(SVG_NS,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','#436b38');
    grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);

    var arrowMarker = document.createElementNS(SVG_NS,'marker');
    arrowMarker.setAttribute('id','arrowHead');
    arrowMarker.setAttribute('viewBox','0 0 10 10');
    arrowMarker.setAttribute('refX','8'); arrowMarker.setAttribute('refY','5');
    arrowMarker.setAttribute('markerWidth','7'); arrowMarker.setAttribute('markerHeight','7');
    arrowMarker.setAttribute('orient','auto-start-reverse');
    var arrowPath = document.createElementNS(SVG_NS,'path');
    arrowPath.setAttribute('d','M1 1L9 5L1 9L3 5Z');
    arrowMarker.appendChild(arrowPath); defs.appendChild(arrowMarker);
    svg.appendChild(defs);

    var bg = document.createElementNS(SVG_NS,'rect');
    bg.setAttribute('x',0); bg.setAttribute('y',0); bg.setAttribute('width',VB_W); bg.setAttribute('height',VB_H);
    bg.setAttribute('fill','url(#grassGrad)');
    svg.appendChild(bg);

    var homeX = 350, homeY = 620;
    var baseDist = 95;
    var outfieldR = 430;

    var p1x = homeX + baseDist, p1y = homeY - baseDist;
    var p2x = homeX, p2y = homeY - baseDist*2;
    var p3x = homeX - baseDist, p3y = homeY - baseDist;

    // Outfield dirt/grass arc (the "skin" arc that extends beyond the infield)
    var flAngle = Math.PI * 0.78, frAngle = Math.PI * 0.22;
    function ptOnArc(angle, radius){
      return [homeX + radius*Math.cos(angle), homeY - radius*Math.sin(angle)];
    }
    var flOuter = ptOnArc(flAngle, outfieldR);
    var frOuter = ptOnArc(frAngle, outfieldR);
    var outfieldSkin = document.createElementNS(SVG_NS,'path');
    outfieldSkin.setAttribute('d', 'M '+homeX+' '+homeY+' L '+flOuter[0]+' '+flOuter[1]+' A '+outfieldR+' '+outfieldR+' 0 0 1 '+frOuter[0]+' '+frOuter[1]+' Z');
    outfieldSkin.setAttribute('fill','#c9a06e');
    svg.appendChild(outfieldSkin);

    // Outfield grass on top of most of the skin, leaving a dirt arc band showing at the true infield/outfield transition
    var grassOverlayR = outfieldR - 34;
    var flInnerG = ptOnArc(flAngle, grassOverlayR);
    var frInnerG = ptOnArc(frAngle, grassOverlayR);
    var outfieldGrass = document.createElementNS(SVG_NS,'path');
    outfieldGrass.setAttribute('d', 'M '+homeX+' '+homeY+' L '+flInnerG[0]+' '+flInnerG[1]+' A '+grassOverlayR+' '+grassOverlayR+' 0 0 1 '+frInnerG[0]+' '+frInnerG[1]+' Z');
    outfieldGrass.setAttribute('fill','url(#grassGrad)');
    svg.appendChild(outfieldGrass);

    // Infield dirt diamond (larger, extends past 2nd base and the deeper SS/2B spots)
    var infieldR = baseDist * 2.55;
    var flInf = ptOnArc(flAngle, infieldR);
    var frInf = ptOnArc(frAngle, infieldR);
    var infield = document.createElementNS(SVG_NS,'path');
    infield.setAttribute('d', 'M '+homeX+' '+homeY+' L '+flInf[0]+' '+flInf[1]+' A '+infieldR+' '+infieldR+' 0 0 1 '+frInf[0]+' '+frInf[1]+' Z');
    infield.setAttribute('fill','#b98a5e');
    infield.setAttribute('stroke','#8f6b45'); infield.setAttribute('stroke-width','1');
    svg.appendChild(infield);

    var grassDiamond = document.createElementNS(SVG_NS,'path');
    var gd = 42;
    infield_grass_points(homeX,homeY,p1x,p1y,p2x,p2y,p3x,p3y,gd);
    function infield_grass_points(hx,hy,x1,y1,x2,y2,x3,y3,inset){
      function towardCenter(x,y){
        var cx=(hx+x2)/2, cy=(hy+y2)/2;
        var dx=cx-x, dy=cy-y; var len=Math.sqrt(dx*dx+dy*dy);
        return [x+dx/len*inset, y+dy/len*inset];
      }
      var hh=towardCenter(hx,hy), a1=towardCenter(x1,y1), a2=towardCenter(x2,y2), a3=towardCenter(x3,y3);
      grassDiamond.setAttribute('d','M '+hh[0]+' '+hh[1]+' L '+a1[0]+' '+a1[1]+' L '+a2[0]+' '+a2[1]+' L '+a3[0]+' '+a3[1]+' Z');
    }
    grassDiamond.setAttribute('fill','#5a8a4a');
    svg.appendChild(grassDiamond);

    var flLine = document.createElementNS(SVG_NS,'line');
    flLine.setAttribute('x1',homeX); flLine.setAttribute('y1',homeY);
    flLine.setAttribute('x2',flOuter[0]); flLine.setAttribute('y2',flOuter[1]);
    flLine.setAttribute('stroke','rgba(255,255,255,0.55)'); flLine.setAttribute('stroke-width','2');
    svg.appendChild(flLine);
    var frLine = document.createElementNS(SVG_NS,'line');
    frLine.setAttribute('x1',homeX); frLine.setAttribute('y1',homeY);
    frLine.setAttribute('x2',frOuter[0]); frLine.setAttribute('y2',frOuter[1]);
    frLine.setAttribute('stroke','rgba(255,255,255,0.55)'); frLine.setAttribute('stroke-width','2');
    svg.appendChild(frLine);

    var outfieldWall = document.createElementNS(SVG_NS,'path');
    outfieldWall.setAttribute('d', 'M '+flOuter[0]+' '+flOuter[1]+' A '+outfieldR+' '+outfieldR+' 0 0 1 '+frOuter[0]+' '+frOuter[1]);
    outfieldWall.setAttribute('fill','none'); outfieldWall.setAttribute('stroke','rgba(255,255,255,0.4)');
    outfieldWall.setAttribute('stroke-width','3');
    svg.appendChild(outfieldWall);

    function base(x,y,isHome){
      var b = document.createElementNS(SVG_NS,'rect');
      var size = 12;
      b.setAttribute('x',x-size/2); b.setAttribute('y',y-size/2);
      b.setAttribute('width',size); b.setAttribute('height',size);
      b.setAttribute('fill','#f2ede3'); b.setAttribute('stroke','#8f6b45'); b.setAttribute('stroke-width','1');
      b.setAttribute('transform','rotate(45 '+x+' '+y+')');
      svg.appendChild(b);
    }
    // 1B/3B bases sit fully in fair territory with their outer corner on the foul line —
    // shift each base center inward (toward home) by half its diagonal along the foul line direction.
    var baseHalfDiag = 12 * Math.SQRT1_2;
    function inward(px, py, towardX, towardY, dist){
      var dx = towardX-px, dy = towardY-py;
      var len = Math.sqrt(dx*dx+dy*dy);
      return [px + (dx/len)*dist, py + (dy/len)*dist];
    }
    var b1 = inward(p1x, p1y, homeX, homeY, baseHalfDiag);
    var b3 = inward(p3x, p3y, homeX, homeY, baseHalfDiag);
    base(b1[0], b1[1]);
    base(p2x, p2y);
    base(b3[0], b3[1]);

    var plate = document.createElementNS(SVG_NS,'path');
    var ps=9;
    plate.setAttribute('d','M '+(homeX-ps)+' '+(homeY-ps)+' L '+(homeX+ps)+' '+(homeY-ps)+' L '+(homeX+ps)+' '+homeY+' L '+homeX+' '+(homeY+ps*0.8)+' L '+(homeX-ps)+' '+homeY+' Z');
    plate.setAttribute('fill','#f2ede3'); plate.setAttribute('stroke','#8f6b45');
    svg.appendChild(plate);

    var mound = document.createElementNS(SVG_NS,'circle');
    mound.setAttribute('cx',homeX); mound.setAttribute('cy',homeY-baseDist); mound.setAttribute('r',14);
    mound.setAttribute('fill','#c69a6c'); mound.setAttribute('stroke','#8f6b45');
    svg.appendChild(mound);

    state.fieldRefPoints = {home:[homeX,homeY], first:[p1x,p1y], second:[p2x,p2y], third:[p3x,p3y]};

    state.pathLayer = document.createElementNS(SVG_NS,'g');
    svg.appendChild(state.pathLayer);
    state.tokenLayer = document.createElementNS(SVG_NS,'g');
    svg.appendChild(state.tokenLayer);
  }

  function defaultPositions(){
    var ref = state.fieldRefPoints;
    var home = ref.home, first = ref.first, second = ref.second, third = ref.third;
    var mid = function(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; };
    var deeperMid = function(a,b,t,pushBack){
      var m = mid(a,b,t);
      var dx = m[0]-home[0], dy = m[1]-home[1];
      var len = Math.sqrt(dx*dx+dy*dy);
      return [m[0] + (dx/len)*pushBack, m[1] + (dy/len)*pushBack];
    };
    var fairShift = function(base, towardSecond, dist){
      var dx = towardSecond[0]-base[0], dy = towardSecond[1]-base[1];
      var len = Math.sqrt(dx*dx+dy*dy);
      return [base[0] + (dx/len)*dist, base[1] + (dy/len)*dist];
    };
    return {
      'P': [home[0], home[1]-95],
      'C': [home[0], home[1]+18],
      '1B': fairShift(first, second, 22),
      '2B': deeperMid(second,first,0.5,40),
      '3B': fairShift(third, second, 22),
      'SS': deeperMid(second,third,0.5,40),
      'LF': [home[0]-166, home[1]-297],
      'CF': [home[0], home[1]-370],
      'RF': [home[0]+166, home[1]-297],
      'R1': fairShift(first, second, 16),
      'R2': fairShift(second, third, 16),
      'R3': fairShift(third, home, 14),
      'BR': [home[0]+18, home[1]-8],
      'CO': [home[0]-60, home[1]+30]
    };
  }

  function addToken(defId, customLabel, customColor, silent){
    var def = PALETTE.filter(function(p){ return p.id===defId; })[0];
    if(!def) return;
    var pos = defaultPositions()[defId] || [200, 300];
    var count = state.tokens.filter(function(t){ return t.defId===defId; }).length;
    var t = {
      instId: uid(),
      defId: defId,
      label: customLabel || def.label,
      color: customColor || def.color,
      isRunner: !!def.isRunner,
      x: pos[0] + (count*10),
      y: pos[1] + (count*10),
      paths: []
    };
    state.tokens.push(t);
    if(!silent){
      renderTokens();
    }
  }

  function addBall(){
    if(state.ball) return;
    state.ball = { x: state.fieldRefPoints.home[0], y: state.fieldRefPoints.home[1]-20, paths: [] };
    renderTokens();
  }

  function renderTokens(){
    while(state.tokenLayer.firstChild) state.tokenLayer.removeChild(state.tokenLayer.firstChild);
    state.tokens.forEach(function(t){
      var g = document.createElementNS(SVG_NS,'g');
      g.setAttribute('class','token');
      g.setAttribute('data-inst', t.instId);
      if(t.isRunner){
        var hit = document.createElementNS(SVG_NS,'circle');
        hit.setAttribute('r', 16); hit.setAttribute('fill','transparent');
        g.appendChild(hit);
        var rCircle = document.createElementNS(SVG_NS,'circle');
        rCircle.setAttribute('r', 8);
        rCircle.setAttribute('fill', t.color);
        rCircle.setAttribute('stroke','rgba(255,255,255,0.85)');
        rCircle.setAttribute('stroke-width','1.25');
        g.appendChild(rCircle);
      } else {
        var circle = document.createElementNS(SVG_NS,'circle');
        circle.setAttribute('r', 16);
        circle.setAttribute('fill', t.color);
        circle.setAttribute('stroke','rgba(255,255,255,0.85)');
        circle.setAttribute('stroke-width','1.5');
        var label = document.createElementNS(SVG_NS,'text');
        label.setAttribute('class','token-label');
        label.textContent = t.label;
        g.appendChild(circle); g.appendChild(label);
      }
      positionToken(g, t.x, t.y);
      state.tokenLayer.appendChild(g);
      attachDrag(g, t);
    });
    if(state.ball){
      var bg = document.createElementNS(SVG_NS,'g');
      bg.setAttribute('class','token');
      bg.setAttribute('data-inst','ball');
      var br = 9;
      var bc = document.createElementNS(SVG_NS,'circle');
      bc.setAttribute('r', br);
      bc.setAttribute('fill', '#f7f2e7');
      bc.setAttribute('stroke', '#c9bfa5'); bc.setAttribute('stroke-width','0.75');
      bg.appendChild(bc);
      // Two curved stitch arcs, mirrored, like a baseball's seam
      var seam1 = document.createElementNS(SVG_NS,'path');
      seam1.setAttribute('d', 'M '+(-br*0.62)+' '+(-br*0.72)+' Q 0 '+(-br*0.15)+' '+(-br*0.62)+' '+(br*0.72));
      seam1.setAttribute('fill','none'); seam1.setAttribute('stroke','#c1553f'); seam1.setAttribute('stroke-width','1');
      var seam2 = document.createElementNS(SVG_NS,'path');
      seam2.setAttribute('d', 'M '+(br*0.62)+' '+(-br*0.72)+' Q 0 '+(br*0.15)+' '+(br*0.62)+' '+(br*0.72));
      seam2.setAttribute('fill','none'); seam2.setAttribute('stroke','#c1553f'); seam2.setAttribute('stroke-width','1');
      bg.appendChild(seam1); bg.appendChild(seam2);
      // Small stitch ticks along each seam for texture
      [-0.5,-0.15,0.2,0.55].forEach(function(t){
        [seam1,seam2].forEach(function(seamRef, idx){
          var sign = idx===0 ? -1 : 1;
          var yy = t*br*0.72*1.35;
          var tick = document.createElementNS(SVG_NS,'line');
          var xx = sign*br*0.62*(1-Math.abs(t)*0.55);
          tick.setAttribute('x1', xx-1.6*sign); tick.setAttribute('y1', yy-1.2);
          tick.setAttribute('x2', xx+1.6*sign); tick.setAttribute('y2', yy+1.2);
          tick.setAttribute('stroke','#c1553f'); tick.setAttribute('stroke-width','0.6');
          bg.appendChild(tick);
        });
      });
      positionToken(bg, state.ball.x, state.ball.y);
      state.tokenLayer.appendChild(bg);
      attachDrag(bg, state.ball, true);
    }
    renderPaths();
  }

  function positionToken(g, x, y){
    g.setAttribute('transform','translate('+x+','+y+')');
  }

  function svgPoint(clientX, clientY){
    var pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    var ctm = svg.getScreenCTM().inverse();
    var p = pt.matrixTransform(ctm);
    return [p.x, p.y];
  }

  var dragCtx = null;
  var segmentOrderCounter = 0;

  function attachDrag(el, obj, isBall){
    el.addEventListener('pointerdown', function(ev){
      if(state.laserActive) return;
      ev.preventDefault();
      ev.stopPropagation();
      el.setPointerCapture(ev.pointerId);
      var p = svgPoint(ev.clientX, ev.clientY);
      dragCtx = { el:el, obj:obj, isBall: !!isBall, startX:obj.x, startY:obj.y, offX: p[0]-obj.x, offY: p[1]-obj.y };
      if(state.mode === 'record'){
        if(!obj.paths) obj.paths = [];
        dragCtx.newSegment = [[obj.x, obj.y]];
      }
    });
    el.addEventListener('pointermove', function(ev){
      if(!dragCtx || dragCtx.el !== el) return;
      var p = svgPoint(ev.clientX, ev.clientY);
      var nx = p[0]-dragCtx.offX, ny = p[1]-dragCtx.offY;
      nx = Math.max(10, Math.min(VB_W-10, nx));
      ny = Math.max(10, Math.min(VB_H-10, ny));
      dragCtx.obj.x = nx; dragCtx.obj.y = ny;
      positionToken(dragCtx.el, nx, ny);
      if(state.mode === 'record' && dragCtx.newSegment){
        dragCtx.newSegment.push([nx, ny]);
        renderPaths();
      }
    });
    el.addEventListener('pointerup', function(ev){
      if(dragCtx && dragCtx.el === el){
        if(state.mode === 'record' && dragCtx.newSegment && dragCtx.newSegment.length >= 2){
          dragCtx.newSegment._order = ++segmentOrderCounter;
          dragCtx.obj.paths.push(dragCtx.newSegment);
        }
      }
      dragCtx = null;
      renderPaths();
    });
  }

  function renderPaths(){
    while(state.pathLayer.firstChild) state.pathLayer.removeChild(state.pathLayer.firstChild);
    if(state.mode !== 'record') return;
    var all = state.tokens.slice();
    if(state.ball) all.push(state.ball);
    all.forEach(function(obj){
      var segs = (obj.paths || []).slice();
      if(dragCtx && dragCtx.obj === obj && dragCtx.newSegment && dragCtx.newSegment.length >= 2){
        segs.push(dragCtx.newSegment);
      }
      var color = obj.color || 'rgba(255,255,255,0.85)';
      segs.forEach(function(seg, idx){
        if(seg.length < 2) return;
        var d = 'M ' + seg.map(function(pt){ return pt[0]+' '+pt[1]; }).join(' L ');
        var path = document.createElementNS(SVG_NS,'path');
        path.setAttribute('class','path-line');
        path.setAttribute('d', d);
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', obj===state.ball ? 2 : 3);
        path.setAttribute('stroke-dasharray', obj===state.ball ? '4,4' : 'none');
        path.setAttribute('marker-end','url(#arrowHead)');
        path.style.color = color;
        path.setAttribute('opacity','0.9');
        state.pathLayer.appendChild(path);
        if(segs.length > 1){
          var mid = seg[Math.floor(seg.length/2)];
          var badge = document.createElementNS(SVG_NS,'circle');
          badge.setAttribute('cx', mid[0]); badge.setAttribute('cy', mid[1]); badge.setAttribute('r', 8);
          badge.setAttribute('fill', color); badge.setAttribute('stroke','rgba(255,255,255,0.9)'); badge.setAttribute('stroke-width','1');
          state.pathLayer.appendChild(badge);
          var num = document.createElementNS(SVG_NS,'text');
          num.setAttribute('x', mid[0]); num.setAttribute('y', mid[1]);
          num.setAttribute('text-anchor','middle'); num.setAttribute('dominant-baseline','central');
          num.setAttribute('font-size','10'); num.setAttribute('font-weight','700'); num.setAttribute('fill','#fff');
          num.textContent = (idx+1);
          state.pathLayer.appendChild(num);
        }
      });
    });
  }

  function clearField(){

  function rewindToPlayStart(){
    if(!state.lastPlayStart || state.lastPlayStart.length === 0){
      showToast('Play the animation once first');
      return;
    }
    var restored = 0;
    state.lastPlayStart.forEach(function(entry){
      var target = entry.instId === 'ball' ? state.ball : state.tokens.filter(function(t){ return t.instId === entry.instId; })[0];
      if(target){
        target.x = entry.ox;
        target.y = entry.oy;
        restored++;
      }
    });
    renderTokens();
    if(restored === 0){
      showToast('That play\u2019s players are no longer on the field');
    } else {
      showToast('Rewound to play start');
    }
  }

  function resetToStartPositions(){
    if(state.tokens.length === 0 && !state.ball){
      showToast('Nothing on the field to reset');
      return;
    }
    var defaults = defaultPositions();
    var seenCounts = {};
    state.tokens.forEach(function(t){
      var base = defaults[t.defId];
      if(base){
        var count = seenCounts[t.defId] || 0;
        t.x = base[0] + (count*10);
        t.y = base[1] + (count*10);
        seenCounts[t.defId] = count+1;
      }
      t.paths = [];
    });
    if(state.ball){
      state.ball.x = state.fieldRefPoints.home[0];
      state.ball.y = state.fieldRefPoints.home[1]-20;
      state.ball.paths = [];
    }
    renderTokens();
    showToast('Players reset to start positions');
  }

  function resetPaths(){
    state.tokens.forEach(function(t){ t.paths = []; });
    if(state.ball) state.ball.paths = [];
    renderPaths();
    showToast('Paths cleared \u2014 drag players to redraw');
  }

  function undoLastSegment(){
    var all = state.tokens.slice();
    if(state.ball) all.push(state.ball);
    var candidates = [];
    all.forEach(function(obj){
      (obj.paths||[]).forEach(function(seg, idx){
        candidates.push({obj:obj, idx:idx, order: seg._order || 0});
      });
    });
    if(candidates.length === 0){
      showToast('No segments to undo');
      return;
    }
    candidates.sort(function(a,b){ return b.order - a.order; });
    var top = candidates[0];
    top.obj.paths.splice(top.idx, 1);
    renderPaths();
    showToast('Last segment removed');
  }

  function snapshotState(){

  function loadPlaySnapshot(snap){
    state.tokens = snap.tokens.map(function(t){
      var def = PALETTE.filter(function(p){ return p.id===t.defId; })[0];
      var paths = t.paths || (t.path && t.path.length > 1 ? [t.path] : []);
      return { instId: uid(), defId:t.defId, label:t.label, color:t.color, isRunner: !!(def && def.isRunner), x:t.x, y:t.y, paths: paths };
    });
    var ballPaths = snap.ball ? (snap.ball.paths || (snap.ball.path && snap.ball.path.length > 1 ? [snap.ball.path] : [])) : [];
    state.ball = snap.ball ? { x: snap.ball.x, y: snap.ball.y, paths: ballPaths } : null;
    renderTokens();
  }

  var speeds = [0.5, 1, 1.5, 2];
  document.getElementById('speedBtn').addEventListener('click', function(){
    var idx = speeds.indexOf(state.playbackSpeed);
    idx = (idx+1) % speeds.length;
    state.playbackSpeed = speeds[idx];
    this.textContent = state.playbackSpeed + 'x';
  });

  document.getElementById('playBtn').addEventListener('click', function(){
    if(state.playing) return;
    runAnimation();
  });

  function runAnimation(){
    var all = state.tokens.slice();
    if(state.ball) all.push(state.ball);
    var animated = all.filter(function(o){ return o.paths && o.paths.length > 0; });
    if(animated.length === 0){
      showToast('No paths recorded \u2014 use Record mode first');
      return;
    }
    state.playing = true;
    var btn = document.getElementById('playBtn');
    btn.classList.add('playing');
    btn.innerHTML = '\u25A0 Playing\u2026';

    // Slot timing is keyed by each token's own segment index (0, 1, 2...), not global
    // recording order. That means every token's FIRST recorded move plays together in
    // slot 0 (true simultaneous, real-time motion), and only a token with a second
    // recorded move (like a ball rolled then thrown) advances into slot 1, while
    // everyone else simply holds their end position during that slot.
    var slotCount = animated.reduce(function(max,o){ return Math.max(max, o.paths.length); }, 0);
    var slotDuration = 1400 / state.playbackSpeed;
    var totalDuration = slotCount * slotDuration;

    // Each token/ball is currently sitting wherever the LAST recording drag left it
    // (that's how paths get drawn). Before playing, snap everything back to the start
    // of its first recorded segment, so playback animates the full move from true start
    // to finish, and so Rewind has the correct original position to restore.
    animated.forEach(function(o){
      var orderedSegs = o.paths.slice().sort(function(a,b){ return (a._order||0)-(b._order||0); });
      if(orderedSegs.length && orderedSegs[0].length){
        o.x = orderedSegs[0][0][0];
        o.y = orderedSegs[0][0][1];
      }
    });
    renderTokens();

    var origPositions = animated.map(function(o){
      return { instId: (o===state.ball ? 'ball' : o.instId), ox:o.x, oy:o.y };
    });
    state.lastPlayStart = origPositions;
    var start = null;

    function pointAlongPath(path, t){
      var totalLen = 0;
      var segLens = [];
      for(var i=1;i<path.length;i++){
        var dx = path[i][0]-path[i-1][0], dy = path[i][1]-path[i-1][1];
        var len = Math.sqrt(dx*dx+dy*dy);
        segLens.push(len);
        totalLen += len;
      }
      if(totalLen === 0) return path[0];
      var target = t * totalLen;
      var acc = 0;
      for(var j=0;j<segLens.length;j++){
        if(acc + segLens[j] >= target){
          var segT = segLens[j] === 0 ? 0 : (target-acc)/segLens[j];
          var x = path[j][0] + (path[j+1][0]-path[j][0])*segT;
          var y = path[j][1] + (path[j+1][1]-path[j][1])*segT;
          return [x,y];
        }
        acc += segLens[j];
      }
      return path[path.length-1];
    }

    function frame(ts){
      if(!start) start = ts;
      var elapsed = ts - start;
      var overallT = Math.min(1, elapsed/totalDuration);

      animated.forEach(function(o){
        var orderedSegs = o.paths.slice().sort(function(a,b){ return (a._order||0)-(b._order||0); });
        var currentPos = null;
        for(var i=0;i<orderedSegs.length;i++){
          var seg = orderedSegs[i];
          var slotIdx = i;
          var slotStart = slotIdx * slotDuration;
          var slotEnd = slotStart + slotDuration;
          if(elapsed < slotStart){
            if(currentPos === null && i === 0){
              currentPos = seg[0];
            }
            break;
          } else if(elapsed >= slotEnd){
            currentPos = seg[seg.length-1];
          } else {
            var localT = (elapsed - slotStart) / slotDuration;
            currentPos = pointAlongPath(seg, localT);
          }
        }
        if(currentPos){
          o.x = currentPos[0]; o.y = currentPos[1];
        }
      });
      renderTokens();
      renderPaths();
      if(overallT < 1){
        requestAnimationFrame(frame);
      }else{
        state.playing = false;
        btn.classList.remove('playing');
        btn.innerHTML = '\u25B6 Play animation';
        showToast('Play complete');
      }
    }
    requestAnimationFrame(frame);
  }

  drawField();
  DEFENSE_IDS.forEach(function(id){ addToken(id, null, null, true); });
  renderTokens();
  setMode('live');

  window.addEventListener('resize', function(){});
})();
</script>
