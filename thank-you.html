<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorado Comets | Registration Received</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #F25C05;
      --black: #0A0A0A;
      --cream: #F2E6D0;
      --charcoal: #1E1E1E;
      --burnt: #C94700;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--black);
      color: var(--cream);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: var(--black);
      border-bottom: 2px solid var(--charcoal);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-header img {
      height: 48px;
      filter: drop-shadow(0 0 12px rgba(242,92,5,0.3));
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .card {
      max-width: 620px;
      width: 100%;
      text-align: center;
    }

    .hero-logo {
      width: 200px;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 30px rgba(242,92,5,0.35));
    }

    .card-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--cream);
      margin-bottom: 24px;
    }

    .card-title span { color: var(--orange); }

    .rule {
      width: 60px;
      height: 4px;
      background: var(--orange);
      margin: 0 auto 28px;
    }

    .card-body {
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.75;
      color: var(--cream);
      opacity: 0.75;
      margin-bottom: 36px;
    }

    .home-btn {
      display: inline-block;
      background: var(--orange);
      color: var(--black);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 18px 52px;
      border: 3px solid var(--burnt);
      box-shadow: 0 0 0 6px rgba(242,92,5,0.12);
      text-decoration: none;
      transition: background 0.2s;
    }

    .home-btn:hover { background: var(--burnt); }

    .footer {
      background: var(--black);
      border-top: 2px solid var(--charcoal);
      padding: 36px 24px;
      text-align: center;
    }

    .footer-tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.3;
    }

    .footer-tagline em { color: var(--orange); font-style: normal; }
  </style>
</head>
<body>

  <header class="site-header">
    <img src="Logo_3_transparent.png" alt="Colorado Comets">
  </header>

  <div class="main">
    <div class="card">
      <img src="Logo_1.png" class="hero-logo" alt="Colorado Comets">
      <p class="card-label">Colorado Comets &bull; 11U Tryouts</p>
      <h1 class="card-title">You're <span>Registered!</span></h1>
      <div class="rule"></div>
      <p class="card-body">Thanks for your interest in the Colorado Comets. We received your registration and will be in touch shortly with everything you need to know about tryouts.</p>
      <a class="home-btn" href="index.html">← Back to Home</a>
    </div>
  </div>

  <div class="footer">
    <p class="footer-tagline">
      <em>Developing Confident Athletes</em> Through Baseball.
    </p>
  </div>

</body>
</html>
